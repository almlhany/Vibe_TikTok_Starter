<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000">
  <title>Vibe — فيديوهات قصيرة</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <section id="feed" class="screen active">
      <header class="topbar">
        <strong>Vibe</strong>
        <button id="searchBtn" class="icon-btn" aria-label="بحث">⌕</button>
      </header>
      <div id="feedList" class="feed-list"></div>
    </section>

    <section id="upload" class="screen">
      <div class="page-head"><h2>إنشاء فيديو</h2></div>
      <div class="upload-card">
        <label class="upload-box">
          <input id="videoInput" type="file" accept="video/*" hidden>
          <span>＋</span>
          <b>اختر فيديو من جهازك</b>
          <small>يمكنك تجربة الرفع محليًا الآن</small>
        </label>
        <video id="preview" controls playsinline hidden></video>
        <input id="caption" class="text-input" maxlength="150" placeholder="اكتب وصف الفيديو...">
        <button id="publishBtn" class="primary">نشر الفيديو</button>
        <p id="uploadStatus" class="muted"></p>
      </div>
    </section>

    <section id="profile" class="screen">
      <div class="profile-head">
        <div class="avatar">V</div>
        <h2>@vibe_user</h2>
        <p>حسابك الشخصي</p>
        <div class="stats">
          <span><b id="followers">0</b><small>متابع</small></span>
          <span><b id="following">0</b><small>يتابع</small></span>
          <span><b id="likes">0</b><small>إعجاب</small></span>
        </div>
      </div>
      <div id="myVideos" class="video-grid"></div>
    </section>

    <nav class="bottom-nav">
      <button data-screen="feed" class="nav active">⌂<small>الرئيسية</small></button>
      <button data-screen="search" class="nav" id="navSearch">⌕<small>اكتشف</small></button>
      <button data-screen="upload" class="nav plus">＋</button>
      <button data-screen="profile" class="nav">♙<small>الملف</small></button>
    </nav>
  </main>

  <dialog id="searchDialog">
    <form method="dialog" class="search-panel">
      <input id="searchInput" autofocus placeholder="ابحث عن فيديو أو مستخدم">
      <button>إغلاق</button>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
